version: 1
applications:
  - appRoot: artifacts/estrada-landscaping
    env:
      variables:
        AMPLIFY_MONOREPO_APP_ROOT: artifacts/estrada-landscaping
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm install --global pnpm@10.26.1
            - printf '\nnode-linker=hoisted\n' >> .npmrc
            - pnpm install --frozen-lockfile
        build:
          commands:
            - bash scripts/build-amplify-site.sh
      artifacts:
        baseDirectory: generated-artifacts/aws-amplify/site
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
